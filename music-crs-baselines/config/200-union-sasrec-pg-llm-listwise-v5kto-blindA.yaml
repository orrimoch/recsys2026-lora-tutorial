# 200 — config 198 + propose-ground recall channel (Track C). union+SASRec+pg
#        recall -> LLM LISTWISE rerank (Gemini) -> v5-kto responder. Blind-A.
#
# Clone of 198 with use_propose_ground:true. Track C (# 4-pg-conv) gated PASS on
# dev turn-1: pg raised recall@100 0.4950 -> 0.5030 (+0.008 ceiling) and LLM-rank
# nDCG@20 0.2259 -> 0.2340 (+0.0081). pg is cold-firable (ignores history) so it
# fires on Blind (100% turn-1). The recall-ceiling lift is the durable signal —
# on Blind both rankers sit at the pool ceiling, so raising recall is the only way
# to move Blind nDCG. EXPECT lossy dev->Blind translation (198's +0.05 dev rerank
# gain went flat on Blind 0.2944); this tests whether the +0.008 recall shows up.
#
# pg uses gemini-2.5-flash (proposal quality = world knowledge of real new-artist
# tracks). Needs GEMINI_API_KEY / GOOGLE_API_KEY. ~$0.10 Gemini for 80 queries
# (pg flash proposals + flash-lite rerank).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

# Track C: propose-ground world-knowledge recall channel (attacks the new-artist wall).
use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash-lite"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
