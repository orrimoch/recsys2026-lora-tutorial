# Exp 028 — top-3 candidates in LM prompt (decouple retrieval from LM citation).
# Single-axis change vs 021 champion: top_n_for_prompt 1 -> 3.
# Everything else identical: wRRF retrieval, Qwen 1.5B, stock prompt,
# max_new_tokens=64.
#
# Hypothesis: our 6 prior retrieval/response experiments all cratered LLM
# judge because the reranker-chosen top-1 became a bad 'recommend_item'
# that the LM confidently (wrongly) described. Passing 3 candidates lets
# the LM cite whichever track best matches the query, decoupling retrieval
# quality from the LM's cited-track choice.
#
# Test condition: if LLM judge stays ~3.15 (vs 021) OR lifts, the coupling
# hypothesis is validated and retrieval experiments can resume (with
# fine-tuned rerankers, CMQR, etc.). If LLM drops materially, the LM
# can't handle multi-candidate format and we need a prompt change.

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
top_n_for_prompt: 3
