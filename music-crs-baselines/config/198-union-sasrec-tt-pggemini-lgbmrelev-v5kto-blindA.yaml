# 198 — Union (BM25 + instruct-dense + same-artist + SASRec + TWO-TOWER +
#        PROPOSE-GROUND[Gemini]) recall -> LGBM lgbm_relev rerank -> v5-kto responder.
#        Blind-A submission. Clone of config 197; adds the two validated wall channels.
#
# Two-tower (Tier-1 #3.3): trained two_tower_v1, dev # 4-tt wall-rescue 0.0199 @ w=0.7.
# Propose-ground (Tier-1 #3.5): LLM world-knowledge channel, dev # 4-pg wall-rescue
#   0.0225. Backend swapped from local Qwen-7B to the Gemini API (gemini-2.5-flash-lite)
#   — cheap/fast for the 80-query Blind-A set, no 7B load. Needs GEMINI_API_KEY /
#   GOOGLE_API_KEY in the env, and `pip install google-genai`.
#
# CAVEAT: reranker is the EXISTING lgbm_relev — it was NOT retrained with these two
# channels, so their recall gains may only partially convert to nDCG@20 (ship-now
# choice; the full conversion path is a 200-pool retrain with use_two_tower).
# Requires two_tower_v1/two_tower.pt present under cache_dir/retrieval_v2/two_tower.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

# --- Tier-1 #3.3 two-tower content channel (multimodal, reaches the new-artist wall)
use_two_tower: true
w_two_tower: 0.7
two_tower_model_dir: "two_tower_v1"

# --- Tier-1 #3.5 propose-then-ground channel via the Gemini API
use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash-lite"
pg_n_proposals: 20
pg_batch_size: 8
pg_inner_dense: "dense_metadata_qwen3_instruct"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_relev"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
