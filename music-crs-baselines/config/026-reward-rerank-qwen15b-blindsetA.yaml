# Exp 026 — response reranker via reward model trained on train
# goal_progress_assessments. Single-axis change vs 021 champion:
# generation-side only. Retrieval (wRRF) and LM base (Qwen 1.5B) unchanged;
# we sample K=3 responses (temperatures 0.3/0.7/1.0) and pick the one the
# reward model scores highest.
#
# Reward model = MiniLM-L-6 cross-encoder fine-tuned via
# colab/Train_Reward_Model.ipynb on ~60k train (context, response, label)
# rows labeled by goal_progress_assessments.
#
# Requires models/reward_model/ (unzipped from Colab's reward_model.zip
# into the repo root) to exist at inference time.
#
# Prediction: +0.1-0.3 LLM judge if reward-model AUC > 0.70 on val.
# nDCG@20 unchanged (retrieval untouched). Composite 0.33 -> ~0.34-0.35.

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
response_max_new_tokens: 192  # allow longer, since reward model picks best
response_reranker_type: "reward_model"
response_reranker_model_path: "../models/reward_model"
response_n_candidates: 3
response_temperatures: [0.3, 0.7, 1.0]
