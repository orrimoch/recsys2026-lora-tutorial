# Phase 1 Bundle B — Qwen3-Embedding-4B swap for the metadata-dense sub of wRRF.
#
# Single-axis change vs config 110: retrieval_type swapped to use Qwen3-4B for
# the metadata-dense stream (everything else identical: BM25, lyrics-dense,
# CMQR, ProRank, responder). Tests "is dense just under-powered" — same family
# as current 0.6B, just 7× larger.
#
# Prerequisite: catalog embeddings must exist at
# `experiments/cache/dense_local/Qwen_Qwen3-Embedding-4B/qwen3-4b-metadata/track_embeddings.pkl`.
# Generate via:
#   python scripts/embed_catalog.py \
#       --model Qwen/Qwen3-Embedding-4B --label qwen3-4b-metadata
# One-time ~45-90 min on Blackwell-95GB (4B model is ~7× the 0.6B baseline).

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_qwen3_4b_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "pro_rank"

response_prompt_name: "response_generation"
response_max_new_tokens: 64
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: true

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96
