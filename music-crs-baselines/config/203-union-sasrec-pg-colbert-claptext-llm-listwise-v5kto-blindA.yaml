# 203 — the plan's FULL ColBERT stack: config 202 + CLAP text->audio channel (P4).
#        union+SASRec+pg+ColBERT(text)+CLAP(audio) recall -> LLM LISTWISE rerank -> v5-kto. Blind-A.
#
# config 202 (ColBERT-only) was submitted to Blind-A and came back FLAT (0.35/nDCG 0.29),
# but that tested only HALF the plan's hypothesis. The plan pairs ColBERT (text late-
# interaction) with CLAP (audio): CLAP reaches new-artist WALL golds by SOUND — orthogonal
# to every text/metadata channel — so the two attack the wall from different angles. The
# clap_text channel is COLD-firable (query text -> CLAP audio space), so it fires on Blind
# (100% turn-1), unlike clap_recall (mean-pools played tracks, dead at turn-1).
# GATE BEFORE SUBMITTING: run nb82 #82-p4-clap — only submit 203 if +colbert+clap beats
# +colbert on turn-1 wall recall@20 (else CLAP injects RRF noise -> drop it or lower w_clap_text).
# Requires the PLAID index (build_colbert_index.py) + GEMINI_API_KEY (pg + listwise rerank).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

# ColBERT full-catalog late-interaction recall channel (text).
use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-v1"
colbert_model: null

# CLAP text->audio recall channel (audio, P4) — the orthogonal wall lever.
use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash-lite"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
