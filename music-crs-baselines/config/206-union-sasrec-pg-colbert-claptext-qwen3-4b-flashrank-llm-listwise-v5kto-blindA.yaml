# 206 — config 205 + EXP-008 Qwen3-Embedding-4B dense channel (the recall-WALL probe).
# ⚠️ GATED: do NOT submit to Blind until the EXP-008 DEV gate passes (nb74 #4-qwen3-4b:
#   union turn-1 recall@100 >= +0.01 AND non-trivial wall-rescue, THEN #12d nDCG@20 >= +0.005).
#   This YAML exists so the Blind run is one step away once the gate passes. Everything = 205.
# NOTE: the Blind responder model is set in the run cell via GEMINI_RESPONDER_MODEL — per the
#   2026-06-13 decision use 'gemini-2.5-flash-lite' (cost/speed, unvalidated).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

# ColBERT full-catalog late-interaction recall channel (text).
use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-v1"
colbert_model: null

# CLAP text->audio recall channel (audio, P4) — the orthogonal wall lever.
use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

# EXP-008: Qwen3-Embedding-4B dense channel (additive). Same family as the provided 0.6B;
# DENSE_LOCAL loads fp16 (G4/T4-safe). Catalog embeddings: scripts/embed_catalog.py
# --model Qwen/Qwen3-Embedding-4B --label qwen3-4b-metadata (one-time). w mirrors the 0.6B dense.
use_qwen3_4b: true
w_qwen3_4b: 0.7

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash"
reranker_max_output_tokens: 2048

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
