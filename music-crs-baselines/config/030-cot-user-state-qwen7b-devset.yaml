# Exp 030 — sibling of 029 swapping the LM only: Qwen 1.5B -> Qwen 7B.
# SAME retrieval (wRRF BM25+metadata+lyrics), SAME CoT user-state prompt
# (response_generation_cot_user_state.txt), SAME max_new_tokens budget.
# Only lm_type changes.
#
# Pair-test design: 029 vs 030 isolates "does a bigger model handle the
# structured CoT format better?" 1.5B in local smoke followed the format
# on ~2/3 samples; 7B should be ~all of them, removing format compliance
# as a confound for measuring the personalization lift from CoT itself.
#
# Note on prior 7B dead-end: prior-branch Qwen 7B + few-shot regressed
# LLM judge by -0.45 with the STOCK prompt (filler words: fantastic /
# perfectly captures). The CoT prompt explicitly bans those words and
# forces grounded specificity, so the prior failure mode shouldn't apply.
# This run will validate or falsify that.
#
# Memory: 7B @ bf16 ≈ 14 GB weights + KV cache. Needs A100 40GB or L4 24GB
# (NOT T4 16GB). batch_size on A100 = 16 (run via Colab notebook).

lm_type: "Qwen/Qwen2.5-7B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 128
