lm_type: null
retrieval_type: "rrf_bm25_dense_metadata_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
# corpus_types here feeds MusicCatalogDB (chat history stringification) and
# the dense sub-retriever (which ignores it). The BM25 sub-retriever uses
# its own 5-field corpus internally, pinned in the factory for rrf_bm25_dense_metadata_v1.
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
# CORRECTED cache_dir (plan bugfix): one `..` up from music-crs-baselines/
# lands at repo root, so `../experiments/cache` resolves inside the repo.
# Prior configs used `../../experiments/cache` which went one level too
# high (outside the repo); caches are now at the correct path.
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
