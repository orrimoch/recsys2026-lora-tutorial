# W7 — End-to-end Blind-B inference config (final submission pipeline).
#
# Composition (full pipeline per plan §6.6 / §10):
#   1. CMQR + StateTracker (W1+W2) — opt-in.
#   2. wRRF top-100 (plan §A3).
#   3. ProRank reranker (W3) → top-20.
#   4. W7-merged Qwen-2.5-7B responder. The W7 retrain pass uses the W6
#      merged base + train+dev combined (per project_submission_prep.md).
#      Output is a fully-merged 7B at orrimoch/recsys2026-{w7_run}-merged.
#      Loaded directly via lm_type with `lora_path: null`.
#   5. A6 catalog-membership filter + A7 dedupe (handled by CRS_BASELINE).
#
# To use:
#   1. Run colab/33_train_responder_grpo_train_plus_dev.ipynb (W7 retrain).
#   2. Replace `PLACEHOLDER` below with the actual `merged_hub_model` field
#      from gate_result.json (e.g. orrimoch/recsys2026-b3-grpo-final-2026-06-15-merged).
#   3. Run inference: `python run_inference_blindset.py --tid 300-final-blindset-B --eval_dataset blindset_B`.
#   4. Validate + package: `python scripts/validate_prediction.py --input ... --split blindB --package ...`.
lm_type: "orrimoch/recsys2026-b3-grpo-final-PLACEHOLDER-merged"
lora_path: null     # already merged; leave null
lora_max_rank: 32   # informational — not used when lora_path is null

retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-B"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

# Plan §A3: top-100 from wRRF, ProRank shrinks to 20.
retrieval_topk: 100

# A5 ProRank reranker.
reranker_type: "pro_rank"

# Same envelope + CoT prompt as W6 dev-eval (config 220).
response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

# vLLM with LoRA support (W4 P0 #3 fix in vllm_model.py).
use_vllm: true

# W1 StateTracker (required by CMQR).
use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

# W2 CMQR.
use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96
