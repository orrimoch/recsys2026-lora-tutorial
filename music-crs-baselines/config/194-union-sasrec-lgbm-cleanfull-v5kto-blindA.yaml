# 194 — Union (BM25 + instruct-dense + same-artist + SASRec) recall -> LGBM rerank
#        (CLEAN, FULL-SCALE, leak-free) -> v5-kto responder. Blind-A submission.
#
# CURRENT BEST (2026-05-29). Identical to config 193 except the reranker points at
# lgbm_clean_full (trained on 15k sessions, nb74 Stage 11) instead of lgbm_clean_v1
# (2k sessions). DEV nDCG@20:
#   recall-only            = 0.1486
#   lgbm_clean_v1 (2k)     = 0.1557
#   lgbm_clean_full (15k)  = 0.1623   <- this config
#
# Leak-free feature set (cfbpr_score + sasrec_rank_inv DROPPED — both were
# in-sample leaked; see project_sasrec_lgbm_feature_leak_2026_05_29). The dense
# channel uses the instruct variant (dense_metadata_qwen3_instruct, the Stage 7
# fix). The SASRec RECALL channel stays (use_sasrec). DO NOT ship config 191
# (leaked reranker, 0.1194). Responder unchanged from 191/193 (v5-kto) so this
# isolates the nDCG/recall improvement on the composite.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_clean_full"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
# raw_with_goal: append the user-stated listener_goal to the retrieval query so
# SERVE matches the goal-ful query the dev recall harness (nb74 cell-4) already
# measures (serve was 'raw' = goal-less = a serve/measurement parity gap).
# VALIDATE on nb74 before submitting: the LGBM was trained goal-less, so confirm
# the goal-ful candidate pool does not shift membership enough to regress nDCG.
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
