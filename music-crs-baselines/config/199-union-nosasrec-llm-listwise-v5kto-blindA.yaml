# 199 — Union (BM25 + instruct-dense + same-artist, NO SASRec) recall -> LLM
#        LISTWISE rerank (Gemini, Track A) -> v5-kto responder. Blind-A submission.
#
# Clone of config 198 with use_sasrec:false. Blind-A is 100% turn-1 (no in-session
# plays), so the SASRec/same-artist SEQUENTIAL recall channels are dead weight
# there — this is the true cold/Blind pool the LLM ranker reorders. The A/B vs 198
# decides the shipped recall config. (same_artist is also session-dead at turn-1
# but is left in the union for the warm dev turns; the binding gate is turn-1.)
#
# GATE: nb74 # 12d-llm-listwise, turn-1 nDCG@20. reranker_model_path = Gemini model
# name. Needs GEMINI_API_KEY / GOOGLE_API_KEY in Colab.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: false

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash-lite"   # <- Gemini model name, NOT a dir

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
