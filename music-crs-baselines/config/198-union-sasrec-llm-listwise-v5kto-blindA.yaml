# 198 — Union (BM25 + instruct-dense + same-artist + SASRec) recall -> LLM LISTWISE
#        rerank (Gemini, Track A) -> v5-kto responder. Blind-A submission.
#
# Clone of config 194 with ONE change: reranker_type lgbm_rerank -> llm_listwise.
# Track A thesis: an LLM that reasons over the pool with real-world music knowledge
# converts pool golds (ranks 21..100) into top-20 where LGBM/cross-encoder/SASRec
# could not (the conversion gap). Mirrors the TalkPlayData generator's Recsys LLM.
#
# GATE BEFORE SUBMIT (nb74 # 12d-llm-listwise): ship only if turn-1 nDCG@20 beats
# lgbm_relev turn-1 AND overall >= 0.1652+0.01. Blind-A is 100% turn-1, so turn-1
# is the binding proxy. Diagnostics: valid-index fraction (>=0.7) + pop-skew.
# reranker_model_path carries the GEMINI MODEL NAME, not a dir. Needs GEMINI_API_KEY
# / GOOGLE_API_KEY in Colab (~$0.05 for the 80 Blind queries).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash-lite"   # <- Gemini model name, NOT a dir

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
