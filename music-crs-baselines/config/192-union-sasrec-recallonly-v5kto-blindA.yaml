# 192 — Union (BM25 + Qwen dense + same-artist + SASRec) recall -> v5-kto
#        responder. NO reranker stage. Blind-A.
#
# SUPERSEDED 2026-05-29 by config 193 (clean LGBM reranker, 0.1558). This
# recall-only config (0.1473) is no longer the best — the leak-free reranker
# beats it. Kept as the no-reranker fallback / ablation reference.
#
# nb74 cell-9 DEV nDCG@20:
#   recall-only (this config) = 0.1473
#   LGBM clean (config 193)   = 0.1558  (best)
#   LGBM no-sasrec            = 0.1435  (loses; cf-bpr leak)
#   LGBM +sasrec              = 0.1194  (loses; both leaked)
# The LGBM rerank stage (config 191) is net-negative because its model-derived
# features (sasrec_rank_inv, cfbpr_score) are in-sample leaked on the
# train-split feature build: optimistic on the train parquet, honest on dev, so
# the model demotes real golds at serve. See config 191 header +
# project_sasrec_lgbm_feature_leak_2026_05_29 memory. Revive 191 only after
# OOF cross-fitting the model-derived features so they beat recall-only.
#
# Identical to config 191 EXCEPT reranker_type/reranker_model_path removed
# (reranker_type falsy -> load_reranker_module returns None -> no rerank stage)
# and retrieval_topk dropped to 20 (no reranker pool needed; responder uses
# top_n_for_prompt=1). The SASRec recall channel stays (honest +0.0586
# recall@100: 0.4961 vs 0.4375).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

# SASRec recall channel (4th union sub). use_sasrec/w_sasrec/sasrec_model_dir flow
# into _wrrf_union_v1_specs via extra_config (whole yaml -> extra_config).
use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 20

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
