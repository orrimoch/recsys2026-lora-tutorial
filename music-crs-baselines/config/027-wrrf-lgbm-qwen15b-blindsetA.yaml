# Exp 027 — A1 LambdaMART reranker on top of wRRF (021 champion stack).
# Retrieval-side single-axis change: add trained LGBM ranker scoring
# wRRF top-100 candidates, narrow to top-20. Everything else (LM, prompt,
# max_new_tokens) matches 021.
#
# Model: LightGBM LambdaRank booster trained via
# colab/Build_LGBM_Features_And_Train.ipynb on 2000 train sessions with
# 11 features per (query, candidate) — wrrf_rank, cfbpr_score, pop_log,
# recency_years, tag_count, artist_in_query, goal_category,
# goal_specificity, user_age_group, user_country, user_gender.
#
# Requires ../models/lgbm_ranker/ to exist at inference time (unzipped
# from the Colab-trained lgbm_ranker.zip in Drive).
#
# Target: nDCG@20 0.19 -> 0.22-0.27 (clears ±0.05 noise). LLM judge
# unchanged (3.15). LexDiv unchanged. Composite 0.33 -> 0.35-0.37.

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
# Retrieval reranker: wRRF top-100 -> LGBM score -> top-20.
reranker_type: "lgbm_rerank"
reranker_model_path: "../models/lgbm_ranker"
retrieval_topk: 100
