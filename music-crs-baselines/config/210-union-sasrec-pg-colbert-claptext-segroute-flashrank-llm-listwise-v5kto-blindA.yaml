# 210 — config 205 + SEGMENT-AWARE routing (use_segment_routing). Blind-A is 25% cold / 75% warm
# (measured 2026-06-15). Routing applies per-query weights by in-session history presence (rrf.py
# fuse_per_sub_segmented, is_warm = has played tracks): same_artist OFF for cold (it's 0.000 cold /
# 0.276 warm) + the NEW 2026-06-15 finding = dense WARM-DOWN (w_qwen_warm 0.7->0.4: dense is cold-
# strong r@20 0.215 but warm-weak 0.111, likely diluting the warm 88%). The 2026-06-08 routing test
# got +0.0042 (same_artist cold=0) but never tried dense-warm-down; this bundles both + pg COLD-only.
# ColBERT/CLAP stay SYMMETRIC (no segment data yet). Everything else = config 205 (0.50 best).
# CAVEAT: Blind ±0.05 noise on 80 sessions can't confirm a small routing gain; read as "did NOT regress".

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

# SEGMENT-AWARE routing (the EXP this config tests).
use_segment_routing: true
w_qwen_cold: 0.7      # dense: keep (cold-strong)
w_qwen_warm: 0.4      # dense: DOWN on warm (new finding — warm-weak/diluting)
# same_artist auto-routes cold=0.0 / warm=1.5; bm25 stays symmetric (1.0).

# pg = cold-firable generative WALL channel -> segment-routed to COLD only (warm carried by
# same_artist/sasrec). w_pg_warm=0.0 zeroes pg's FUSION on warm (pg still generates for all queries
# -> a QUALITY route, not a serve-cost cut). Applied because use_segment_routing is on (above).
use_propose_ground: true
w_propose_ground: 0.5
w_pg_cold: 0.5
w_pg_warm: 0.0
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-v1"
colbert_model: null

use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash"
reranker_max_output_tokens: 2048

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
