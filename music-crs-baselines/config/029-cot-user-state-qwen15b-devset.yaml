# Exp 029 — inline CoT user-state extraction prompt (single-axis change vs 020/021).
# Same retrieval (wRRF BM25+metadata+lyrics) + same LM (Qwen 2.5-1.5B) as champion.
# Only the response prompt changes: stock "response_generation.txt" ->
# "response_generation_cot_user_state.txt". The LM emits a strict structured
# <user_state> block (mood / intent / energy / sonic_pref / era_pref /
# language_pref / familiarity_pref / recent_signals / avoid) followed by
# <response>...</response>. crs_baseline.extract_cot_response strips the
# user_state envelope so predicted_response (= what Gemini judges) is the
# response prose only.
#
# response_max_new_tokens bumped 64 -> 192 to fit the user_state block (~50
# tokens) + response (2-3 sentences ~50 tokens) + tags (~10 tokens). Bare
# response budget remains the same as 021.
#
# Dev-side first to (a) confirm the prompt+parser pipeline works end-to-end
# on 8000 rows and (b) qualitatively read responses before risking a
# Blind-A submission slot. Per fresh-model policy, no Blind-A ship without
# explicit gate.

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 128
