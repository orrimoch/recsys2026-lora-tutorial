# Exp 029 Blind-A — sibling of 029 dev-set yaml, only test_dataset_name
# changes from talkpl-ai/TalkPlayData-Challenge-Dataset (train+dev) to
# the Blind-A split. Same retrieval (wRRF BM25+metadata+lyrics), same LM
# (Qwen 2.5-1.5B), same CoT user-state prompt, same response_max_new_tokens.
#
# Ships ONE Blind-A submission (80 rows, scored by Gemini on
# Personalization + Explanation Quality + retrieval).
#
# Per fresh-model policy (project_fresh_model_state.md): user explicitly
# overrode the no-Blind-A-without-gate rule for this experiment because
# CoT user-state extraction is a meaningfully different prompt mechanism
# than the prior 7 rejected experiments — those tested model size,
# reranker, persona prompt, longer responses, top-3 candidates,
# LambdaMART, and reward reranker. CoT structured user state has not
# been tested on this branch.

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 128
