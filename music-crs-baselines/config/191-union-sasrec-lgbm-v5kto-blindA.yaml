# Submission: Stage A union (3-channel wRRF + SASRec) + Stage C LGBM LambdaRank.
#
# Single-axis change vs config 190: ADDS the content-fused SASRec recall channel
# (use_sasrec) to the union AND feeds its per-candidate rank into the LGBM as the
# sasrec_rank_inv relevance feature (reranker_model_path -> lgbm_sasrec_v1, trained
# with that column). Everything else (responder, state tracker, CMQR-off) is copied
# verbatim from 190 so this isolates the SASRec contribution.
#
# Recall evidence (nb72, FULL dev): union+SASRec recall@100 = 0.4961 vs 0.4375
# (3-chan), +0.0586; content is the lever (id-proxy +0.0015). w_sasrec=1.0 is the
# robust pick from the fusion-weight sweep.
#
# crs_baseline auto-feeds sasrec_rank to the LGBM reranker when the model lists
# sasrec_rank_inv and the retriever exposes per-sub rankings (no extra config).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

# SASRec recall channel (4th union sub). use_sasrec/w_sasrec/sasrec_model_dir flow
# into _wrrf_union_v1_specs via extra_config (whole yaml -> extra_config).
use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_sasrec_v1"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
