# Submission: Stage A union (3-channel wRRF) + Stage C LGBM LambdaRank.
#
# Single-axis change vs config 182: drops the chain reranker (CE → LGBM)
# and replaces retrieval with the union (wrrf_union_v1 = BM25 + dense-Qwen +
# same_artist). session_cf was dropped after the G1 ablation (marginal recall
# +0.002 @100, below the 0.01 keep rule).
# Cross-encoder (Stage B) is intentionally absent — union recall feeds
# directly into the LGBM LambdaRank reranker (retrieval_topk=100 → top-20).
#
# Responder keys are copied verbatim from 182 (v5-kto merged, state tracker,
# response_generation_cot_user_state prompt). CMQR disabled (use_cmqr: false)
# so the union retriever is the sole recall source.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_v1"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
