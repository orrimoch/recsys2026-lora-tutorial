# W4 B1 — End-to-end devset eval of the KTO-trained responder.
#
# Composition (full pipeline):
#   1. CMQR + StateTracker (W1+W2) — opt-in via use_state_tracker + use_cmqr.
#   2. wRRF top-100 (plan §A3).
#   3. ProRank reranker (W3) → top-20.
#   4. KTO-trained Qwen-2.5-7B responder (W4 B1) — adapter loaded from Hub
#      (set reranker_model_path to the LoRA adapter path produced by
#      colab/30_train_responder_kto.ipynb, e.g.
#      "orrimoch/recsys2026-b1-kto-qwen7b-2026-05-22").
#
# W4 gate (plan §4): format compliance ≥ 95% AND dev nDCG@20 not regressed
# > 0.005 vs frozen-retriever (the W3 result). Format compliance is checked
# in the training notebook; nDCG no-regression is checked HERE via the
# evaluator's standard nDCG@20 metric.
#
# IMPORTANT: this config assumes the KTO adapter exists. If running BEFORE
# the adapter is trained, set lm_type to the un-adapted base
# Qwen/Qwen2.5-7B-Instruct (and the run will measure the un-trained
# baseline of the new pipeline).

lm_type: "Qwen/Qwen2.5-7B-Instruct"
# W4 P0 #3: vllm_model.py + lm_modules/__init__.py now support PEFT/LoRA
# adapters. Set `lora_path` below to the W4 KTO adapter (HF repo or local
# dir) and the responder LM loads the base + adapter automatically.
# Works on both use_vllm=true (vLLM enable_lora + LoRARequest) and
# use_vllm=false (transformers + PeftModel.from_pretrained).
#
# Examples:
#   lora_path: "orrimoch/recsys2026-b1-kto-qwen7b-2026-05-22"  # from Hub
#   lora_path: "/path/to/training_runs/b1-kto-qwen7b-2026-05-22"  # local dir
#
# Until W4 KTO has shipped, leave lora_path unset to evaluate the un-trained
# Qwen-7B baseline on the new pipeline (CMQR + ProRank + base responder).
lora_path: null  # set after W4 KTO completes
lora_max_rank: 32  # must match LoraConfig(r=...) used during training

retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

# Plan §A3: top-100 from wRRF, ProRank shrinks to 20.
retrieval_topk: 100

# A5 ProRank reranker.
reranker_type: "pro_rank"

# CoT prompt (plan §6.5) — KTO-trained model expects the envelope. Use the
# existing CoT prompt; W4 training data was envelope-augmented so the model
# learned this exact format.
response_prompt_name: "response_generation_cot_user_state"
# Bigger budget — envelope tags ~12 tok + state block ~60 tok + response
# 60-110 words ≈ 220 tok = ~290 tokens minimum. Use 320 for headroom; cuts
# `</response>` mid-tag would zero R_format on every row (W4 review P1).
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

# vLLM on Colab A100 for ~5-10x throughput on Qwen-7B.
use_vllm: true

# W1 StateTracker (required by CMQR).
use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

# W2 CMQR.
use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96
