# 211 — config 205 with the LLM-listwise reranker upgraded gemini-2.5-flash -> gemini-2.5-PRO (ONE change).
# Hypothesis: a stronger reasoner ranking the SAME k=50 pool converts more of the rank-21..100 golds into
# the top-20 (recall@20 0.32 vs recall@100 0.50 = ~18% of golds in-pool but below 20). Follows the EXP-006
# pattern (flash-lite->flash gave +0.0344 nDCG); model strength is the unexplored reranker axis (window/
# cross-encoder/rich-context/LGBM all tried = noise/flat). reranker_max_output_tokens=2048 kept (pro thinks).
# Read responder-SILENT: nDCG@20 axis only (--retrieval_only stub responses). Everything else = config 205.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-v1"
colbert_model: null

use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-pro"      # <-- the only change vs 205 (was gemini-2.5-flash)
reranker_max_output_tokens: 2048

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
