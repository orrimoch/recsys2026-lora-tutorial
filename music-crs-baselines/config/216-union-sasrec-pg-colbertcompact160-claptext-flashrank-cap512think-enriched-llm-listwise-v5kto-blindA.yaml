# 216 — config 215 + ONE change: COMPACT ColBERT query (Option B). The ONLY delta vs
# 215 is the ColBERT channel's query, so 216-vs-215 isolates the compact-query effect.
#
# WHY: ColBERT (BERT, 512-tok ceiling) was fed the full dialog (451 tok mean serve / 615
# train) -> 75-88% right-truncated to noise; goal/culture (appended last) cut off ~75% of
# warm sessions; serve injected raw track-id UUIDs (12-24% of tokens, OOD vs train). Fix:
# feed ColBERT only goal+culture+last-user-turn (median 88 tok, fits q_len=160 ~99%), built
# by the SAME build_retrieval_query(mode="compact_colbert") in BOTH train + serve.
#
# *** REQUIRES A COMPACT RETRAIN BEFORE THIS CONFIG IS VALID *** (do NOT run on the 0.50
# model — that's a silent train/serve skew). Produce a NEW versioned checkpoint+index:
#   1) python scripts/build_colbert_train_data.py --compact-query --output <compact>.jsonl
#   2) python scripts/train_colbert.py --q-len 160 --d-len 96 --out-dir <compact-model>
#   3) python scripts/build_colbert_index.py  --model <compact-model> --index-name colbert-music-compact-v1
# Then confirm the Blind/DEV log shows "[rrf] sub colbert_index: query_key='colbert_query'
# ROUTED per-channel query" (NOT "FELL BACK") — that's the C2 misconfig guard.
# GATE on DEV recall@100 (cold/warm) vs the old full-dialog ColBERT before banking; ColBERT
# is 1 of ~7 union channels. See project_colbert_qlen_blinda_truncation_2026_06_15.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

# ColBERT full-catalog late-interaction recall channel (text) — COMPACT query (Option B).
use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-compact-v1"   # NEW: compact-trained PLAID index (step 3)
colbert_q_len: 160      # compact query median 88 tok -> 160 fits ~99%; MUST equal train --q-len
colbert_model: "../experiments/cache/retrieval_v2/colbert/music-colbert-compact-v1"  # NEW compact checkpoint (step 2)
colbert_compact_query: true   # ACTIVATES per-channel routing: ColBERT reads batch_context['colbert_query']

# CLAP text->audio recall channel (audio, P4) — the orthogonal wall lever.
use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash"
reranker_max_output_tokens: 2048
reranker_thinking_budget: 512    # flash WITH thinking but CAPPED (reduced from default dynamic)

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
# Other channels (bm25/dense/pg/clap) keep raw_enriched; only ColBERT gets the compact query.
query_preprocessing_mode: "raw_enriched"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
