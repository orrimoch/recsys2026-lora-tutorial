# Exp 025 — A2 cf-bpr user×item retriever added as 4th wRRF branch.
# Single-axis change vs 021 champion: retrieval swap
# wrrf_bm25_dense_lyrics_v1 -> wrrf_bm25_dense_lyrics_cfbpr_v1.
# Everything else (Qwen 1.5B + stock prompt + max_new_tokens 64) held.
# cf-bpr weight=0.25 (lighter than dense 0.40) because only ~43% of
# Blind-A users are warm; weight must not over-contribute for the
# cold users who will see an empty ranking from the cf-bpr sub.
# Gate: offline composite_retrieval >= 0.0767, nDCG@20 >= 0.1209
# (021 offline baseline).

lm_type: "Qwen/Qwen2.5-1.5B-Instruct"
