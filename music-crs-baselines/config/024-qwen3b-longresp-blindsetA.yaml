# Exp 024 — response-side isolation vs 021 baseline.
# Two single-direction changes, NO retrieval change:
#   1. lm_type Qwen 1.5B -> Qwen 2.5-3B (more coherent + better citation)
#   2. response_max_new_tokens 64 -> 192 (fix the length cap; prior-branch
#      v10 was 81 words / 192 tokens for LLM 3.25)
# Retrieval: wRRF(BM25 + dense-metadata + dense-lyrics), unchanged from 021.
# Reranker: NONE. Exp 023 showed BGE-reranker-v2-m3 semantically sensible
# but misaligned with Blind-A's preference-based ground truth; it tanked
# nDCG@20 0.19 -> 0.07 even without a code bug. Wrong tool for this task.
# Target: composite 0.33 -> ~0.36-0.38.

lm_type: "Qwen/Qwen2.5-3B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
response_prompt_name: "response_generation"
response_max_new_tokens: 192
