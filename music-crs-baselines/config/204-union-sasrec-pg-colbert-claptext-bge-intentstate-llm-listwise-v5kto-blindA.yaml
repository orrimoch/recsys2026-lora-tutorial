# 204 — config 203 + item 1 (intent_state Q* rewrite) + item 7 (bge diffuse channel).
#        union+SASRec+pg+ColBERT+CLAP+bge recall, with Q* query rewrite -> LLM listwise -> v5-kto.
#        (Submit with the Gemini responder swap for the LLM axis — see nb82 #82-blindA-204.)
#
# Adds the two plan levers on top of the best stack (203):
#   - intent_state (W1.a, plan §3/§5): rewrites each turn's raw query into a clean, self-
#     contained, goal+profile-seeded query_star (Gemini flash-lite, cached). Feeds ALL content
#     channels (ColBERT/CLAP/BM25/dense/bge) a sharper query; falls back to the raw query on
#     any failure (bit-identical to off). NEW intent signal also available for adaptive weights.
#   - bge (item 7, plan §1/§4): a complementary bge-base-en-v1.5 diffuse-context dense view,
#     orthogonal to the Qwen3 dense channel. Catalog embeddings computed+cached on first run.
# Needs GEMINI_API_KEY (intent_state + pg + listwise rerank). First run also embeds the 47k
# catalog with bge-base-en (~minutes, cached). All recall levers; dev->Blind is lossy.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-v1"
colbert_model: null

use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

# item 7: bge-base-en diffuse-context dense channel
use_bge: true
w_bge: 0.5

# item 1: intent_state Q* rewrite (query preprocessing)
use_intent_state: true
intent_state_model: "gemini-2.5-flash-lite"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash-lite"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
