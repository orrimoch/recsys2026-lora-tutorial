# Phase 1 Bundle A + W6 v5-kto MERGE — BGE-M3 retriever stacked with the
# Gemini-tuned v5-kto-merged responder, on Blind-A.
#
# Intended use (after notebook 52's Bundle A leaderboard score):
#   - If 122 (BGE-M3 + Qwen-1.5B responder) shows ANY improvement on
#     Blind-A vs current leaderboard (composite 0.21, nDCG@20 ~0.06), then
#     this config compounds: better candidates from BGE-M3 + Gemini-aligned
#     prose from v5-kto. The two improvements are independent components,
#     both single-axis vs current leaderboard:
#       - vs current submission (Qwen3-0.6B retriever + v5-kto): only the
#         metadata-dense embedder changes (Qwen3 → BGE-M3).
#       - vs config 122 (BGE-M3 + Qwen-1.5B): only the responder changes.
#
# Origin of v5-kto merged repo: see project_w6_v5kto_validated.md.
#   Repo: OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged
#
# To run:
#   python run_inference_blindset.py --tid 132-bge-m3-v5kto-prorank-rerank-blindsetA --batch_size 32
#
# Wallclock estimate: ~45-90 min on L4 (3B responder is larger than 1.5B,
# so longer than config 122; v5-kto also generates longer responses
# because of CoT + envelope formatting).

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_bm25_dense_lyrics_bge_m3_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "pro_rank"

# v5-kto-trained prompt + longer max_new_tokens to accommodate CoT + envelope.
response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96
