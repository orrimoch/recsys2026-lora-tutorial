# 215 — config 205 + two changes: (1) flash reranker thinking CAPPED at 512 (reduced from default dynamic — keep some reasoning, free budget for the ranking); (2) query_preprocessing_mode=raw_enriched (adds preferred_musical_culture + demographics to the retrieval query -> all channels incl pg). raw_enriched targets the COLD segment + wall (unused taste signal). Responder-silent nDCG read.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

use_propose_ground: true
w_propose_ground: 0.5
pg_model: "gemini-2.5-flash"
pg_n_proposals: 20
pg_batch_size: 4
pg_inner_dense: "dense_metadata_qwen3_instruct"

# ColBERT full-catalog late-interaction recall channel (text).
use_colbert: true
w_colbert: 1.0
colbert_index_folder: null
colbert_index_name: "colbert-music-v1"
colbert_q_len: 96       # train/index/serve parity (model trained+indexed at 96). 128 was a serve-only mismatch that rescued ~1/80 Blind queries (real queries are 451 tok mean -> 75% truncate at ANY q_len<=512). See project_colbert_qlen_blinda_truncation_2026_06_15.
colbert_model: null

# CLAP text->audio recall channel (audio, P4) — the orthogonal wall lever.
use_clap_text: true
w_clap_text: 1.0
clap_text_model: "laion/larger_clap_music"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "llm_listwise"
reranker_model_path: "gemini-2.5-flash"
reranker_max_output_tokens: 2048
reranker_thinking_budget: 512    # flash WITH thinking but CAPPED (reduced from default dynamic)

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_enriched"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
