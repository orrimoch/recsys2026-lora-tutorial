# W5 B2 — End-to-end devset eval of the S-DPO-trained responder.
#
# CONDITIONAL: this stage only runs if W4 KTO format compliance < 70%
# (plan §6.3 row B2). If W4 already passes, **skip this config and use 200**
# (the W4 KTO eval config) directly.
#
# Composition (full pipeline):
#   1. CMQR + StateTracker (W1+W2) — opt-in via use_state_tracker + use_cmqr.
#   2. wRRF top-100 (plan §A3).
#   3. ProRank reranker (W3) → top-20.
#   4. S-DPO-refined Qwen-2.5-7B responder (W5 B2) — adapter loaded via
#      lora_path. The adapter was trained on top of W4 KTO weights (merged
#      into base before S-DPO LoRA was added), so loading just the W5
#      adapter is sufficient — it inherits W4's envelope-fluency.
#
# IMPORTANT — adapter chaining: this config loads ONLY the W5 S-DPO adapter.
# If you need to re-eval the W4 KTO checkpoint instead, use config 200.
#
# To use:
#   1. Run colab/31_train_responder_sdpo.ipynb to produce the adapter.
#   2. Replace `null` below with the produced adapter repo
#      (e.g. "orrimoch/recsys2026-b2-sdpo-qwen7b-2026-05-29").
#   3. Run inference: `python run_inference_devset.py --tid 210-... --device cuda`.

# W5 review P0 #2 fix — deployment design.
#
# The W5 S-DPO LoRA was trained on top of (Qwen-7B + W4-merged-base) — it
# encodes a delta relative to that, NOT relative to raw Qwen-7B. Loading
# the W5 adapter via vllm_model.LoRARequest on top of raw Qwen produces
# garbage at inference (every neuron differs from training).
#
# Fix: notebook 31 cell 10b merges (W5 LoRA + W4-merged-base) into a
# fully-merged 7B and pushes to Hub as `orrimoch/recsys2026-b2-sdpo-qwen7b-
# {date}-merged`. This config points lm_type at that merged model
# directly — no LoRA at inference.
#
# Set lm_type below to the MERGED repo (read from gate_result.json's
# `merged_hub_model` field after W5 ships).
lm_type: "orrimoch/recsys2026-b2-sdpo-qwen7b-PLACEHOLDER-merged"
lora_path: null    # already merged; leave as null
lora_max_rank: 32  # informational — not used when lora_path is null

retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

# Plan §A3: top-100 from wRRF, ProRank shrinks to 20.
retrieval_topk: 100

# A5 ProRank reranker.
reranker_type: "pro_rank"

# CoT prompt — S-DPO trained the model to emit this envelope reliably.
response_prompt_name: "response_generation_cot_user_state"
# Same envelope budget as W4 — envelope tags ~12 + state ~60 + response ~220.
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

# vLLM with LoRA support (W4 P0 #3 fix in vllm_model.py).
use_vllm: true

# W1 StateTracker (required by CMQR).
use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

# W2 CMQR.
use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96
