# 196 — IDENTICAL to config 194 except responder_use_goal: false -> true.
#
# Single-axis A/B (responder lever). 194 is the validated baseline (composite
# 0.35, nDCG 0.29, LLM 2.7). The listener_goal (the user's stated session
# intent, e.g. "wants to explore different artists") is currently dropped before
# the responder — the local LLM never sees it. responder_use_goal appends it to
# the responder system prompt (see crs_baseline._get_system_prompt) so the model
# can tailor its recommendation rationale to the stated intent.
#
# RETRIEVAL + RERANKER UNCHANGED, and top_n_for_prompt stays 1 (so this isolates
# the goal effect from config 195's top_n change). Measure on the nb75
# Gemini-judge harness BEFORE spending a Blind-A submission. DO NOT change any
# other axis here. Caveat: v5-kto was fine-tuned WITHOUT goal in the prompt, so
# this is a small train/inference prompt shift — judge it, don't assume it wins.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_clean_full"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"
responder_use_goal: true

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
