# 193 — Union (BM25 + Qwen dense + same-artist + SASRec) recall -> LGBM rerank
#        (CLEAN, leak-free feature set) -> v5-kto responder. Blind-A.
#
# CURRENT HONEST BEST (2026-05-29). nb74 cell-9 DEV nDCG@20:
#   recall-only (config 192)        = 0.1473
#   LGBM clean (this config)        = 0.1558   <-- best, +0.0085 over recall-only
#   LGBM no-sasrec (cfbpr kept)     = 0.1435   (loses; cf-bpr leak)
#   LGBM +sasrec (both leaked)      = 0.1194   (loses hard; config 191)
#
# The clean reranker drops BOTH model-derived LEAKED features:
#   - cfbpr_score    : challenge cf-bpr user vectors were BPR-fit on user plays,
#                      so it's leak-optimistic on the train-split feature build
#                      but honest on dev. Costs -0.0123 (clean 0.1558 vs
#                      no-sasrec 0.1435). Can't be OOF'd (we don't train it).
#                      DROPPED PERMANENTLY.
#   - sasrec_rank_inv: SASRec memorized in-session transitions on the train
#                      split. DROPPED here; revivable only via OOF cross-fit
#                      (config 191 + OOF) if it then beats 0.1558.
# See project_sasrec_lgbm_feature_leak_2026_05_29 memory.
#
# The SASRec RECALL channel STAYS (use_sasrec: true) — its +0.0586 recall@100
# (0.4961 vs 0.4375) is honest (measured on dev). Only the rerank FEATURE was
# leaked, not the recall channel. crs_baseline only issues the SASRec per-sub
# ranking call when the reranker lists sasrec_rank_inv; this clean model does
# NOT, so no sasrec_rank is fed to the reranker (correct — it would be ignored
# anyway). Identical to config 191 except reranker_model_path -> lgbm_clean_v1.
#
# NOTE: lgbm_clean_v1 was trained on a 2000-session sample (nb74 cell 6/7).
# Rebuild features at full scale before a real Blind-A submission.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

# SASRec recall channel (4th union sub). Recall lever is honest; keep it.
use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_v1"

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_clean_v1"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
