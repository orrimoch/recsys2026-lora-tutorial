# 199 — In-pool SASRec (goal-ful) serve SCAFFOLD. Clone of config 194 with:
#   (a) sasrec_context_use_goal: true   -> goal-ful SASRec context at serve (the
#       REQUIRED serve half of the 3-way parity; only valid with a goal-TRAINED
#       model -> sasrec_inpool_v1, NEVER the goal-less sasrec_v1).
#   (b) sasrec_model_dir: sasrec_inpool_v1  -> the in-pool fine-tuned model.
# Everything else == 194 (union+SASRec recall -> LGBM rerank -> v5-kto responder).
#
# ⚠️ STATUS: SCAFFOLD, do NOT submit as-is. It currently uses the in-pool model as
# the SASRec RECALL channel + the existing LGBM ranker. The plan's intended use is
# the in-pool model as the RANKER (replace/augment LGBM), which needs a serve-code
# change (a new reranker_type that scores the pool by the SASRec cosine) — that and
# the reranker_model_path below are finalized AFTER the nb74 # 12c-inpool 3-way gate
# picks the winner (SASRec-alone / LGBM-alone / LGBM+inpool-feature). Gate first.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_union_v1"

use_sasrec: true
w_sasrec: 1.0
sasrec_model_dir: "sasrec_inpool_v1"        # <- in-pool fine-tuned (goal-trained)
sasrec_context_use_goal: true               # <- goal-ful context (serve parity)

test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
# RERANKER — GATE-DEPENDENT (do not finalize before nb74 # 12c-inpool):
#   - SASRec-alone wins  -> needs a new reranker_type 'sasrec_inpool' (serve code).
#   - LGBM+inpool-feature -> retrain LGBM with the in-pool score, repoint here.
#   - LGBM-alone wins     -> in-pool didn't help; revert to config 194.
# Placeholder = the 194 LGBM so the config is runnable as the conservative baseline.
reranker_type: "lgbm_rerank"
reranker_model_path: "/content/drive/MyDrive/recsys2026_retrieval_v2_cache/lgbm/lgbm_clean_full"

response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw_with_goal"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: false
