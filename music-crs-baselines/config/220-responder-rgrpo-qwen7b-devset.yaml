# W6 B3 — End-to-end devset eval of the Rank-GRPO-trained responder.
#
# Composition (full pipeline):
#   1. CMQR + StateTracker (W1+W2) — opt-in via use_state_tracker + use_cmqr.
#   2. wRRF top-100 (plan §A3).
#   3. ProRank reranker (W3) → top-20.
#   4. Rank-GRPO-refined Qwen-2.5-7B responder (W6 B3) — adapter MERGED into
#      the (W5 [or W4]-merged) base before W6, then W6 LoRA merged on top
#      and pushed as `orrimoch/recsys2026-{w6_run}-merged`. Loaded directly
#      via lm_type — `lora_path: null`. Same deployment pattern as W5 P0 #2.
#
# To use:
#   1. Run colab/32_train_responder_grpo.ipynb to produce the merged repo.
#   2. Replace `PLACEHOLDER` below with the actual `merged_hub_model` field
#      from gate_result.json (e.g. orrimoch/recsys2026-b3-grpo-qwen7b-2026-06-08-merged).
#   3. Run inference: `python run_inference_devset.py --tid 220-responder-rgrpo-qwen7b-devset --device cuda`.
lm_type: "orrimoch/recsys2026-b3-grpo-qwen7b-PLACEHOLDER-merged"
lora_path: null     # already merged; leave as null
lora_max_rank: 32   # informational — not used when lora_path is null

retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

# Plan §A3: top-100 from wRRF, ProRank shrinks to 20.
retrieval_topk: 100

# A5 ProRank reranker.
reranker_type: "pro_rank"

# CoT prompt — Rank-GRPO trained on this prompt envelope WITH the
# <reranker_rationales> block appended at training time. The prompt
# template assembled by the inference path must include the same block;
# this is wired by run_inference_devset.py via reranker_type=pro_rank
# (which exposes per-item rationales) + a small adapter step.
response_prompt_name: "response_generation_cot_user_state"
# Same envelope budget as W4/W5.
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

# vLLM with LoRA support (W4 P0 #3 fix in vllm_model.py).
use_vllm: true

# W1 StateTracker (required by CMQR).
use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

# W2 CMQR.
use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96
