# Exp 023 — three-axis sophisticated stack on Blind-A.
# Baseline: 021 (stock prompt, Qwen 1.5B, wRRF) scored composite 0.33 / LLM 3.15.
# Changes from 021 baseline:
#   1. lm_type Qwen 1.5B -> Qwen 2.5-3B (more coherent long responses, better citation)
#   2. reranker_type bge_reranker_v2_m3 over wRRF top-40 -> top-20 (retrieval quality)
#   3. response_max_new_tokens 64 -> 192 (fixes length cap; prior-branch v10 was 81 words)
# Stock response prompt RETAINED (exp 022 falsified the persona prompt on Qwen 1.5B).
# Target: composite 0.33 -> ~0.39-0.41.

lm_type: "Qwen/Qwen2.5-3B-Instruct"
retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "mps"
attn_implementation: "eager"
response_prompt_name: "response_generation"
reranker_type: "bge_reranker_v2_m3"
retrieval_topk: 40
response_max_new_tokens: 192
