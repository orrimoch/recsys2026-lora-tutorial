# Phase 1 Bundle C — chat-history windowing on top of the v5-kto baseline.
#
# Single-axis change vs the May 15 v5-kto Blind-A submission (composite 0.21):
#   new field: chat_history_window: 3
# Everything else identical — same retriever (wrrf_bm25_dense_lyrics_v1),
# same CMQR, same ProRank, same v5-kto-merged 3B responder, same prompts.
#
# Why we expect this to help: Phase 0 diagnostic showed long queries (>30
# words) had recall@20 = 0.247 vs short queries (<10 words) at 0.359 — an
# 11pp drop. Conversation history is concatenated into the retrieval input;
# as it grows, it adds off-topic noise that pulls retrieval away from the
# user's current intent. Limiting to the last 3 turn-pairs (6 messages) is
# the standard conversational-IR trick — recent context grounds the query
# without overwhelming it.
#
# This config has ZERO additional compute setup (no catalog re-embed, no
# query generation). Just edit chat_history_window and re-run.

lm_type: "OrRim123/recsys2026-b3-grpo-pilot-2026-05-13-qwen3b-v5-kto-merged"
lora_path: null
lora_max_rank: 32

retrieval_type: "wrrf_bm25_dense_lyrics_v1"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../experiments/cache"
device: "cuda"
attn_implementation: "sdpa"

retrieval_topk: 100
reranker_type: "pro_rank"

# v5-kto-trained prompt + longer max_new_tokens for CoT + envelope.
response_prompt_name: "response_generation_cot_user_state"
response_max_new_tokens: 320
top_n_for_prompt: 1
query_preprocessing_mode: "raw"

use_vllm: false

use_state_tracker: true
state_tracker_prompt_name: "state_extraction"
state_tracker_max_new_tokens: 96

use_cmqr: true
cmqr_prompt_name: "cmqr_rewrites"
cmqr_n_rewrites: 4
cmqr_topk_per_rewrite: 50
cmqr_rrf_k: 60
cmqr_max_new_tokens: 96

# Phase 1 Bundle C — THE ONLY NEW KNOB.
# Use the last N=3 turn-pairs (6 messages) instead of full history.
chat_history_window: 3
