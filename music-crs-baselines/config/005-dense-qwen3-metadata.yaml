lm_type: null
retrieval_type: "dense_precomputed"
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
user_split_types:
  - "all_users"
# corpus_types here drives MusicCatalogDB.id_to_metadata (used to
# stringify music-role turns in chat history). The dense retriever
# itself ignores corpus_types; the embedding column is hard-coded in
# mcrs/retrieval_modules/dense_precomputed.py (attributes-qwen3_embedding_0.6b).
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
cache_dir: "../../experiments/cache"
device: "mps"
attn_implementation: "eager"
